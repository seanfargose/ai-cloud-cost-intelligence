services:
  # AI Cost Intelligence Backend Web Service (100% Free Tier - Zero Database Limit Errors)
  - type: web
    name: ai-cost-intelligence-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build --workspace=backend && npm run build --workspace=ai-analysis-engine
    startCommand: npm run start --workspace=backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        value: https://ai-cloud-cost-intelligence.vercel.app
      - key: SKIP_DATABASE
        value: "true"
      - key: SKIP_REDIS
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AWS_ROLE_ARN
        sync: false
      - key: AZURE_SUBSCRIPTION_ID
        sync: false
      - key: GCP_PROJECT_ID
        sync: false
