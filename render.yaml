services:
  # AI Cost Intelligence Backend Service
  - type: web
    name: ai-cost-intelligence-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build --workspace=backend && npm run build --workspace=ai-analysis-engine && (npm run build --workspace=mcp-servers/azure-cost-mcp || true) && (npm run build --workspace=mcp-servers/aws-cost-mcp || true) && (npm run build --workspace=mcp-servers/gcp-cost-mcp || true)
    startCommand: npm run start --workspace=backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        value: https://ai-cloud-cost-intelligence.vercel.app
      - key: SKIP_DATABASE
        value: "false"
      - key: SKIP_REDIS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: cost-intelligence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cost-intelligence-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AWS_ROLE_ARN
        sync: false
      - key: AZURE_SUBSCRIPTION_ID
        sync: false
      - key: GCP_PROJECT_ID
        sync: false

  # Redis Cache Instance
  - type: redis
    name: cost-intelligence-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # internal access only

databases:
  # PostgreSQL 16 Instance
  - name: cost-intelligence-db
    plan: starter
    region: oregon
    databaseName: cost_optimization
    user: postgres
    postgresMajorVersion: 16
