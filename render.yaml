services:
  # AI Cost Intelligence Backend Service
  - type: web
    name: ai-cost-intelligence-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build --workspace=backend && npm run build --workspace=ai-analysis-engine
    startCommand: npm run start --workspace=backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: FRONTEND_URL
        value: https://ai-cloud-cost-intelligence.vercel.app
      - key: SKIP_DATABASE
        value: "false"
      - key: SKIP_REDIS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cost-intelligence-db
          property: connectionString

databases:
  # PostgreSQL Database Instance (Free Tier)
  - name: cost-intelligence-db
    plan: free
    region: oregon
    databaseName: cost_optimization
    user: cost_admin
