# ============================================================
# Secret — Sensitive configuration (template)
# ============================================================
# IMPORTANT: Do NOT commit real values. Use Sealed Secrets,
# External Secrets Operator, or CI/CD injection in production.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: cost-platform-secrets
  namespace: cost-platform
  labels:
    app.kubernetes.io/part-of: cost-platform
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "your-anthropic-api-key-here"
  DB_HOST: "psql-cost-platform-prod.postgres.database.azure.com"
  DB_USER: "costplatformadmin"
  DB_PASSWORD: "your-db-password-here"
  REDIS_URL: "rediss://:your-redis-key@redis-cost-platform-prod.redis.cache.windows.net:6380"
  AZURE_SUBSCRIPTION_ID: ""
  AZURE_CLIENT_ID: ""
  AZURE_CLIENT_SECRET: ""
  AZURE_TENANT_ID: ""
