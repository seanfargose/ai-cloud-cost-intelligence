# ============================================================
# Deploy Pipeline — Push to ACR, Apply Terraform, Deploy to AKS
# ============================================================
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_terraform:
        description: "Skip Terraform apply (deploy app only)"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write  # For Azure OIDC login
  contents: read

env:
  ACR_NAME: acrcostplatform${{ inputs.environment }}
  AKS_CLUSTER: aks-cost-platform-${{ inputs.environment }}
  RESOURCE_GROUP: rg-cost-platform-${{ inputs.environment }}

jobs:
  push-images:
    name: Build & Push Images to ACR
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/cost-platform-backend:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/cost-platform-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend,ignore-error=true

      - name: Build & push dashboard
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/cost-platform-dashboard:${{ github.sha }}
            ${{ env.ACR_NAME }}.azurecr.io/cost-platform-dashboard:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard,ignore-error=true

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: push-images
    if: ${{ !inputs.skip_terraform }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file=environments/${{ inputs.environment }}.tfvars \
            -var="db_admin_password=${{ secrets.DB_ADMIN_PASSWORD }}" \
            -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  deploy-to-aks:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [push-images, terraform]
    if: always() && needs.push-images.result == 'success'
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      - name: Update image tags in manifests
        run: |
          ACR_SERVER="${{ env.ACR_NAME }}.azurecr.io"
          sed -i "s|ACR_LOGIN_SERVER|${ACR_SERVER}|g" k8s/backend/deployment.yaml
          sed -i "s|ACR_LOGIN_SERVER|${ACR_SERVER}|g" k8s/dashboard/deployment.yaml
          sed -i "s|:latest|:${{ github.sha }}|g" k8s/backend/deployment.yaml
          sed -i "s|:latest|:${{ github.sha }}|g" k8s/dashboard/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/network-policy.yaml
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/dashboard/
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/backend -n cost-platform --timeout=120s
          kubectl rollout status deployment/dashboard -n cost-platform --timeout=120s

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n cost-platform
          echo ""
          echo "=== Services ==="
          kubectl get svc -n cost-platform
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n cost-platform
